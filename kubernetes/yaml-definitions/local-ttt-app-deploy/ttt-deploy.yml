# YAML is case sensitive
# use spaces not a tab
apiVersion: apps/v1  # specify api to use for deployment
kind: Deployment  # kind of service/object you want to create
metadata:
  name: ttt-app-deployment # name the deployment
spec:
  selector:
    matchLabels:
      app: ttt-app  # look for this label/tag to match with k8 service
  # create a replica set of this with instances/pods
  replicas: 3
  template:
    metadata:
      labels:
        app: ttt-app

    spec:
      containers:
      - name: ttt-app
        image: thantzintun234/tech613-tttapp:1.2.0
        ports:
        - containerPort: 3000