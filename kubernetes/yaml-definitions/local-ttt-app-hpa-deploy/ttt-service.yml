apiVersion: v1
kind: Service
metadata:
  name: ttt-service
  namespace: default
spec:
  ports:
  - nodePort: 30001 # range is 30000-32767
    port: 3000
    targetPort: 3000

  selector:
    app: ttt-app  # this label connects this service to the deployment

  type: NodePort  # also use LoadBalancer - for local use cluster IP